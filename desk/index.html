<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>TTFC Check-in</title>
    <!-- Unlisted staff tool: never indexed, never followed, never cached by search engines. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="TTFC 2026 guest check-in, for TTFC staff and volunteers." />
    <meta name="theme-color" content="#0B0823" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TTFC Check-in" />
    <meta name="application-name" content="TTFC Check-in" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <!-- The manifest and icons sit in the app's own folder, linked from the root: the page is served at every station's
         address too (/checkin/lobby, /checkin/floor-1…: src/checkin/lib/routes.js). -->
    <link rel="manifest" href="/checkin/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="96x96" href="/checkin/icons/icon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/checkin/icons/apple-touch-icon.png" />
    <style>
      html { background: #0B0823; }
      html[data-theme="light"] { background: #F6F4FB; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="ci-root"></div>
    <noscript>TTFC Check-in needs JavaScript.</noscript>
    <script>
      /* Never a blank station: if the app's scripts don't load (or it hasn't started after 12 s), say so, with a way out. */
      (function () {
        var shown = false;
        function show() {
          var r = document.getElementById("ci-root");
          if (shown || !r || r.childElementCount) return;
          shown = true;
          r.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font:18px -apple-system,system-ui,sans-serif;color:#F7F5FF">'
            + '<div><h1 style="font-size:24px;margin:0 0 8px">TTFC Check-in didn’t load</h1><p style="color:#BDB4DD;margin:0 0 16px">Check the Wi-Fi, then try again.</p>'
            + '<button type="button" onclick="location.reload()" style="min-height:56px;padding:0 28px;border:0;border-radius:14px;background:#8B52E0;color:#fff;font-size:18px">Try again</button></div></main>';
        }
        window.addEventListener("error", function (e) { var t = e && e.target; if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) setTimeout(show, 0); }, true);
        setTimeout(show, 12000);
      })();
    </script>
    <script type="module" src="/src/checkin/main.jsx"></script>
  </body>
</html>
