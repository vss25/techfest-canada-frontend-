<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get the TTFC app</title>
    <!-- The check-in desk's lobby QR code opens this (src/lib/getApp.js): it sends a phone on to its own store. -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B0823" />
    <style>
      html { background: #0B0823; color: #F7F5FF; font: 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
      a { color: #C9B3FF; }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-size: 24px">Get the TTFC app</h1>
      <p>Opening the store…</p>
      <noscript><p><a href="/app/install?from=qr">Get the TTFC app</a></p></noscript>
    </main>
    <script type="module" src="/src/getApp/main.js"></script>
  </body>
</html>
