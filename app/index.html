<!doctype html>
<html lang="en" class="dark-ground">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TTFC 2026</title>
    <meta name="description" content="The Tech Festival Canada 2026 attendee app: schedule, speakers, live polls, Q&amp;A and chat. Oct 26–27, Westin Harbour Castle, Toronto." />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- /app/rate ("Rate the app", Oct 27 2026; src/lib/rate.js): phones go straight to their store's review page
         before the app loads (?store=ios|android picks one); anything else gets the screen with both badges. -->
    <!-- After a new deploy, a page that was already open (or that the browser restores) still asks for the
         previous build's files. They're gone, and the site answers with this page instead, so nothing loads (a
         white screen; Oct 27 2026, after the Tickets update). Reload once to get the new build. -->
    <script>
      (function () {
        var KEY = "ttfc.staleReload";
        function reloadOnce() {
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < 30000) return;   // at most once every 30 s: never a reload loop
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) { return; }                      // storage blocked: no reload (it couldn't stop a loop)
          location.reload();
        }
        // A page's code that loads later (lazy pages): Vite's own event.
        window.addEventListener("vite:preloadError", function (e) { e.preventDefault(); reloadOnce(); });
        // The build's own files (the main script, its imports, the stylesheet).
        window.addEventListener("error", function (e) {
          var t = e.target;
          var url = t && (t.tagName === "SCRIPT" ? t.src : t.tagName === "LINK" ? t.href : "");
          if (url && url.indexOf("/assets/") !== -1) reloadOnce();
        }, true);
      })();
    </script>
    <script>
      (function () {
        try {
          if (location.pathname.replace(/\/+$/, "").toLowerCase() !== "/app/rate") return;
          var s = (new URLSearchParams(location.search).get("store") || "").toLowerCase();
          var ua = navigator.userAgent || "";
          var ios = s === "ios" || (!s && (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)));
          var android = s === "android" || (!s && /Android/i.test(ua));
          if (ios) location.replace("https://apps.apple.com/app/id6820764803?action=write-review");
          else if (android) location.replace("https://play.google.com/store/apps/details?id=com.atlaslinkmarkets.ttfc");
        } catch (e) { /* the screen does it itself */ }
      })();
    </script>

    <!-- Installable app: only /app advertises these (the marketing pages don't). -->
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="theme-color" content="#0E0828" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FCF8FB" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" sizes="96x96" href="/app/icons/icon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TTFC" />
    <meta name="application-name" content="TTFC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Home Screen launch images (iOS): the app's LaunchBackground, glow and logo. -->
    <link rel="apple-touch-startup-image" href="/app/splash/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/app/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/app/splash/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/app/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/app/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/app/splash/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <!-- Paint the brand ground before any script runs (no white flash). -->
    <style>
      /* Only <html> gets the ground: <body> stays transparent so the app's fixed backdrops show. */
      html { background: #0E0828; }
      body { margin: 0; }
      @media (prefers-color-scheme: light) { html:not([data-theme="dark"]) { background: #FCF8FB; } }
      html[data-theme="light"] { background: #FCF8FB; }
      html[data-theme="dark"] { background: #0E0828; }
      /* The launch screen and sign-in are always dark: so is any strip the page doesn't cover (iOS standalone). */
      html.dark-ground { background: #0B0823 !important; }
      /* Launch screen until the first screen has rendered (as the iOS app's LaunchBackground). */
      #boot-splash {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background:
          radial-gradient(100vmax 100vmax at 90% 0%, rgba(242, 84, 158, 0.42), transparent 60%),
          radial-gradient(95vmax 95vmax at 0% 30%, rgba(140, 82, 224, 0.42), transparent 60%),
          radial-gradient(90vmax 90vmax at 92% 100%, rgba(245, 135, 51, 0.26), transparent 60%),
          #0B0823;
        transition: opacity 0.25s ease;
      }
      #boot-splash img { width: min(64vw, 291px); height: auto; margin-top: -6vh; }
      #boot-splash.is-done { opacity: 0; pointer-events: none; }
    </style>
    <script>
      // Theme chosen in Profile (system / light / dark), applied before first paint.
      (function () {
        try {
          var t = localStorage.getItem("ttfc.app.theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) { /* storage blocked */ }
        // A sign-in link handed over from /app-login: take the token out of the address bar
        // before anything else reads the URL (src/app/screens/Login.jsx picks it up).
        try {
          var h = location.hash.replace(/^#/, "");
          if (h.indexOf("token=") !== -1) {
            var p = new URLSearchParams(h);
            var tk = p.get("token");
            if (tk) window.__ttfcLoginToken = tk;
            history.replaceState(history.state, "", location.pathname + location.search);
          }
        } catch (e) { /* Login.jsx falls back to the hash */ }
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true"><img src="/app/brand/logo.webp" alt="" width="870" height="429" /></div>
    <div id="app-root"></div>
    <noscript><style>#boot-splash { display: none; }</style>The TTFC app needs JavaScript. You can still see the agenda at https://www.thetechfestival.com/agenda</noscript>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
