    <!-- Sign-in links (/app-login?token=…): move the one-time token out of the
         address bar before any analytics script reads the page URL.
         src/pages/AppLogin.jsx picks it up from sessionStorage. -->
    <script>
      (function () {
        try {
          if (location.pathname.replace(/\/+$/, "") !== "/app-login") return;
          var p = new URLSearchParams(location.search);
          var t = p.get("token");
          if (!t) return;
          sessionStorage.setItem("ttfc.appLoginToken", t);
          history.replaceState(null, "", "/app-login");
        } catch (e) { /* storage blocked: AppLogin falls back to the URL */ }
      })();
    </script>

    <!-- Analytics / advertising (Google Analytics 4, Meta Pixel, visitor identification)
         are NOT loaded here. src/lib/trackers.js injects them only after the visitor
         chooses "Accept All" in the cookie banner (localStorage tfc_cookie_consent = "all").
         These stubs only queue calls in memory so window.gtag / window.fbq (e.g. the
         Purchase event in src/pages/Tickets.jsx) never throw; nothing is sent unless
         the real scripts are loaded after consent. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
      (function (f) {
        if (f.fbq) return;
        var n = f.fbq = function () {
          if (n.callMethod) n.callMethod.apply(n, arguments);
          else n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
      })(window);
    </script>
