    <!-- After a new deploy, a page that was already open (or that the browser restores) still asks for the
         previous build's files. They're gone, and the site answers with this page instead, so nothing loads (a
         white screen; Oct 27 2026, after the Tickets update). Reload once to get the new build. -->
    <script>
      (function () {
        var KEY = "ttfc.staleReload";
        function reloadOnce() {
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < 30000) return false; // at most once every 30 s: never a reload loop
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) { return false; }                // storage blocked: no reload (it couldn't stop a loop)
          location.reload();
          return true;
        }
        // A page's code that loads later (lazy pages): Vite's own event. When we don't reload, the error goes on to
        // the page's error boundary (src/components/RouteErrorBoundary.jsx), which offers "Reload".
        window.addEventListener("vite:preloadError", function (e) { if (reloadOnce()) e.preventDefault(); });
        // The build's own files (the main script, its imports, the stylesheet).
        window.addEventListener("error", function (e) {
          var t = e.target;
          var url = t && (t.tagName === "SCRIPT" ? t.src : t.tagName === "LINK" ? t.href : "");
          if (url && url.indexOf("/assets/") !== -1) reloadOnce();
        }, true);
      })();
    </script>

    <!-- Sign-in links (/app-login?token=…): move the one-time token out of the
         address bar before any analytics script reads the page URL.
         src/pages/AppLogin.jsx picks it up from sessionStorage. -->
    <script>
      (function () {
        try {
          if (location.pathname.replace(/\/+$/, "") !== "/app-login") return;
          var p = new URLSearchParams(location.search);
          var t = p.get("token");
          if (!t) return;
          sessionStorage.setItem("ttfc.appLoginToken", t);
          history.replaceState(null, "", "/app-login");
        } catch (e) { /* storage blocked: AppLogin falls back to the URL */ }
      })();
    </script>

    <!-- Personal RSVP links (/rsvp#t=<ticketId>&fn=<first>&ln=<last>, from the Speaker
         Pass email; the same keys in the query string work too): take the ticket ID and
         name out of the address bar before any analytics script reads the page URL.
         Held in memory only; src/pages/Rsvp.jsx reads them once to fill in the form. -->
    <script>
      (function () {
        try {
          if (location.pathname.replace(/\/+$/, "") !== "/rsvp") return;
          var h = new URLSearchParams(location.hash.replace(/^#/, ""));
          var q = new URLSearchParams(location.search);
          var got = {}, any = false;
          ["t", "fn", "ln"].forEach(function (k) {
            var v = h.has(k) ? h.get(k) : q.get(k);
            if (v !== null) { got[k] = v; any = true; }
            h.delete(k); q.delete(k);
          });
          if (!any) return;
          window.__ttfcRsvpPrefill = got;
          var qs = q.toString(), hs = h.toString();
          history.replaceState(history.state, "", location.pathname + (qs ? "?" + qs : "") + (hs ? "#" + hs : ""));
        } catch (e) { /* Rsvp.jsx reads and clears the address bar itself */ }
      })();
    </script>

    <!-- The attendee survey's personal links (/survey?t=<token>, from the apps and the survey
         email, Oct 26 2026): move the token out of the address bar before any analytics script
         reads the page URL. Kept for this tab; src/pages/Survey.jsx passes it to the server. -->
    <script>
      (function () {
        try {
          if (location.pathname.replace(/\/+$/, "").toLowerCase() !== "/survey") return;
          var q = new URLSearchParams(location.search);
          var t = q.get("t");
          if (t === null) return;
          window.__ttfcSurveyToken = t;
          try { sessionStorage.setItem("ttfc.surveyToken", t); } catch (e) { /* memory only */ }
          q.delete("t");
          var qs = q.toString();
          history.replaceState(history.state, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
        } catch (e) { /* Survey.jsx reads and clears the address bar itself */ }
      })();
    </script>

    <!-- "Rate the app" (/rate, Oct 27 2026; src/lib/rate.js): an iPhone / iPad goes straight to the App Store's
         review page and an Android phone to Google Play, before the site loads (?store=ios|android picks one).
         Anything else loads the page, which shows both store badges. -->
    <script>
      (function () {
        try {
          var p = location.pathname.replace(/\/+$/, "").toLowerCase();
          if (p !== "/rate") return;
          var s = (new URLSearchParams(location.search).get("store") || "").toLowerCase();
          var ua = navigator.userAgent || "";
          var ios = s === "ios" || (!s && (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)));
          var android = s === "android" || (!s && /Android/i.test(ua));
          if (ios) location.replace("https://apps.apple.com/app/id6820764803?action=write-review");
          else if (android) location.replace("https://play.google.com/store/apps/details?id=com.atlaslinkmarkets.ttfc");
        } catch (e) { /* the page does it itself */ }
      })();
    </script>

    <!-- Staff panel (/admin, /admin-login): its light / dark choice (System, Light or Dark,
         saved in this browser by src/admin/theme.js) is applied before the first paint,
         so the panel never flashes the other theme. Nothing happens on other pages. -->
    <script>
      (function () {
        try {
          if (!/^\/admin(-login)?(\/|$)/i.test(location.pathname)) return;
          var choice = null;
          try { choice = localStorage.getItem("ttfc.admin.theme"); } catch (e) { /* storage blocked: follow the device */ }
          var mq = function (q) { return window.matchMedia(q).matches; };
          var sysDark = !window.matchMedia || mq("(prefers-color-scheme: dark)") || !mq("(prefers-color-scheme: light)");
          var dark = choice === "dark" || (choice !== "light" && sysDark);
          document.documentElement.setAttribute("data-admin-theme", dark ? "dark" : "light");
        } catch (e) { /* the panel applies it itself once it loads */ }
      })();
    </script>

    <!-- Analytics / advertising (Google Analytics 4, Meta Pixel, visitor identification)
         are NOT loaded here. src/lib/trackers.js injects them only after the visitor
         chooses "Accept All" in the cookie banner (localStorage tfc_cookie_consent = "all").
         These stubs only queue calls in memory so window.gtag / window.fbq (e.g. the
         Purchase event in src/pages/Tickets.jsx) never throw; nothing is sent unless
         the real scripts are loaded after consent. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
      (function (f) {
        if (f.fbq) return;
        var n = f.fbq = function () {
          if (n.callMethod) n.callMethod.apply(n, arguments);
          else n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
      })(window);
    </script>
